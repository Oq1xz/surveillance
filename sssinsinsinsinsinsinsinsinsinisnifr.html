<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>セキュア・ライブカメラ端末 (Node)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0a0c14; color:#d1d5db; font-family: 'Courier New', monospace;
    height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px;
    overflow: hidden;
  }
  .setup-box { background: #111424; padding: 30px; border-radius: 12px; text-align: center; border: 1px solid #1f293d; max-width: 340px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  h3 { color: #00e5ff; margin-bottom: 20px; font-size: 18px; letter-spacing: 1px; }
  input { background: #1f293d; border: 1px solid #374151; color: #fff; padding: 12px; margin-bottom: 14px; border-radius: 6px; text-align: center; font-size: 15px; width: 100%; outline: none; }
  input:focus { border-color: #00e5ff; }
  button { background: #00e5ff; color: #0b0f19; border: none; padding: 14px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; transition: 0.2s; }
  button:hover { background: #00b9cc; transform: translateY(-1px); }
  .status-card { display: none; background: #111424; padding: 20px; border-radius: 12px; border: 1px solid #1f293d; text-align: center; min-width: 280px; }
  .status-flex { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #ef4444; }
  .dot.on { background: #10b981; box-shadow: 0 0 10px #10b981; }
  .bat-info { font-size: 13px; color: #9ca3af; margin-top: 8px; }
  video { width:1px; height:1px; position:fixed; opacity:0; pointer-events: none; }

  /* 🔴 ステルス（真っ黒）モード用のスタイル */
  #stealth-screen {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: #000000; z-index: 9999;
    flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
  }
  .stealth-ui {
    opacity: 0; transition: opacity 0.3s ease;
    display: flex; flex-direction: column; align-items: center; gap: 30px;
    pointer-events: none; /* UI外のタップを検知させるため */
  }
  .stealth-ui.show { opacity: 1; pointer-events: auto; }
  
  .transmit-badge {
    color: #ef4444; font-size: 22px; font-weight: bold; letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
    animation: pulse 1.5s infinite alternate;
  }
  .switch-btn {
    background: rgba(255,255,255,0.15); color: #fff; border: 1px solid #444;
    padding: 12px 30px; border-radius: 30px; font-size: 16px; cursor: pointer;
    backdrop-filter: blur(4px);
  }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0.4; } }
</style>
</head>
<body>

<div id="auth-area" class="setup-box">
  <h3>🔒 CAMERA SECURE NODE</h3>
  <input type="password" id="secret-key" placeholder="共通の合言葉を入力">
  <input type="text" id="camera-name" placeholder="カメラ名 (例: リビング、スマホ1)">
  <button onclick="startSecureCamera()">安全な接続を確立</button>
</div>

<div id="active-area" class="status-card">
  <div class="status-flex">
    <span class="dot" id="dot"></span>
    <span id="msg">システム初期化中...</span>
  </div>
  <div id="bat-status" class="bat-info">バッテリー連携: 待機中</div>
</div>

<div id="stealth-screen">
  <div id="stealth-ui" class="stealth-ui">
    <div class="transmit-badge">🔴 送信中</div>
    <button class="switch-btn" onclick="toggleCamera(event)">🔄 カメラ切替</button>
  </div>
</div>

<video id="video" autoplay playsinline muted></video>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
const dot = document.getElementById('dot');
const msg = document.getElementById('msg');
const batStatus = document.getElementById('bat-status');
const stealthScreen = document.getElementById('stealth-screen');
const stealthUI = document.getElementById('stealth-ui');

let secret = "";
let camName = "";
let batteryTimer = null;
let currentStream = null;
let activeCall = null;
let currentFacingMode = 'environment'; // 初期はリアカメラ(外カメ)
let uiTimeout = null;

// ▼ カメラデバイスの取得・初期化
async function getMediaStream() {
  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
  }
  const constraints = {
    video: { facingMode: currentFacingMode },
    audio: false
  };
  currentStream = await navigator.mediaDevices.getUserMedia(constraints);
  document.getElementById('video').srcObject = currentStream;
  return currentStream;
}

// ▼ フロント/リアカメラの動的切り替え
async function toggleCamera(e) {
  e.stopPropagation(); // 画面全体のタップ判定を暴発させない
  currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
  
  try {
    const newStream = await getMediaStream();
    
    // WebRTC通信中なら、映像トラックだけをすり替える（再接続不要）
    if (activeCall && activeCall.peerConnection) {
      const videoTrack = newStream.getVideoTracks()[0];
      const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) {
        sender.replaceTrack(videoTrack);
      }
    }
    showStealthUI(); // 切り替え後もUIの表示時間をリセットしてキープ
  } catch (err) {
    alert("カメラの切り替えに失敗しました");
  }
}

// ▼ ステルス画面をタップしたときのUI表示処理（2秒後に消去）
stealthScreen.addEventListener('click', showStealthUI);

function showStealthUI() {
  stealthUI.classList.add('show');
  if (uiTimeout) clearTimeout(uiTimeout);
  uiTimeout = setTimeout(() => {
    stealthUI.classList.remove('show');
  }, 2000);
}

// ▼ メイン処理の開始
async function startSecureCamera() {
  secret = document.getElementById('secret-key').value.trim();
  camName = document.getElementById('camera-name').value.trim() || "LiveCam";
  if(!secret) { alert("合言葉を入力してください"); return; }

  document.getElementById('auth-area').style.display = 'none';
  document.getElementById('active-area').style.display = 'block';

  try {
    await getMediaStream();
    msg.textContent = 'セキュアポート準備中...';
    initSecurePeer();
  } catch(e) {
    msg.textContent = 'カメラ起動エラー';
    console.error(e);
  }
}

function initSecurePeer() {
  const myID = 'secure-cam-' + btoa(encodeURIComponent(secret)).replace(/=/g, '') + '-' + encodeURIComponent(camName);
  const targetID = 'secure-monitor-' + btoa(encodeURIComponent(secret)).replace(/=/g, '');

  const peer = new Peer(myID, { host:'0.peerjs.com', port:443, secure:true });

  peer.on('open', () => {
    msg.textContent = 'モニターを探索中...';
    establishPipeline(peer, targetID);
  });

  peer.on('error', (e) => {
    if(e.type === 'unavailable-id' || e.type === 'invalid-id') {
      msg.textContent = '再接続ロック中（待機）';
    } else {
      msg.textContent = '接続エラー: ' + e.type;
    }
    dot.className = 'dot';
  });
}

function establishPipeline(peer, targetID) {
  activeCall = peer.call(targetID, currentStream);
  let isConnected = false;

  activeCall.peerConnection.onconnectionstatechange = () => {
    const state = activeCall.peerConnection.connectionState;
    
    if (state === 'connected') {
      isConnected = true;
      // 接続成功時：ステータス画面を消し、真っ暗なステルス画面へ移行
      document.getElementById('active-area').style.display = 'none';
      stealthScreen.style.display = 'flex';
      
      if(batteryTimer) clearInterval(batteryTimer);
      reportBattery(peer, targetID);
      batteryTimer = setInterval(() => reportBattery(peer, targetID), 45000);

    } else if ((state === 'disconnected' || state === 'failed') && isConnected) {
      // 切断時：ステルス画面を解除し、元のステータス画面に戻して再接続を待つ
      stealthScreen.style.display = 'none';
      document.getElementById('active-area').style.display = 'block';
      reconnectPipeline(peer, targetID);
    }
  };

  activeCall.on('close', () => reconnectPipeline(peer, targetID));
  activeCall.on('error', () => reconnectPipeline(peer, targetID));
}

function reconnectPipeline(peer, targetID) {
  if(batteryTimer) clearInterval(batteryTimer);
  stealthScreen.style.display = 'none';
  document.getElementById('active-area').style.display = 'block';
  msg.textContent = '接続待機中...';
  dot.className = 'dot';
  
  setTimeout(() => {
    if(!peer.destroyed) establishPipeline(peer, targetID);
  }, 5000);
}

async function reportBattery(peer, targetID) {
  try {
    if (!navigator.getBattery) return;
    const battery = await navigator.getBattery();
    const level = Math.floor(battery.level * 100);
    const conn = peer.connect(targetID);
    conn.on('open', () => {
      conn.send({ type: 'bat-sync', name: camName, level: level });
      batStatus.textContent = `バッテリー: ${level}% (同期中)`;
      setTimeout(() => conn.close(), 1500);
    });
  } catch (e) {}
}
</script>
</body>
</html>f
