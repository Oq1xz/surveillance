<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>セキュリティカメラ端末</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0f111a; color:#e0e0e0; font-family: monospace;
    height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
  }
  .setup-box { background: #1a1d29; padding: 25px; border-radius: 8px; text-align: center; border: 1px solid #2d3245; max-width: 320px; width: 90%; }
  input { background: #2d3245; border: 1px solid #555; color: #fff; padding: 10px; margin-bottom: 12px; border-radius: 4px; text-align: center; font-size: 14px; width: 100%; }
  button { background: #00d4ff; color: #000; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
  button:hover { background: #00b3d7; }
  .status { font-size: 14px; display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#ff4d4d; }
  .dot.on { background:#00ff88; box-shadow: 0 0 8px #00ff88; }
  .hint { font-size: 11px; color: #555; margin-top: 10px; }
  video { width:1px; height:1px; position:fixed; opacity:0; }
</style>
</head>
<body>

<div id="auth-area" class="setup-box">
  <h3 style="color:#00d4ff; margin-bottom:15px;">CAMERA NODE SETUP</h3>
  <input type="password" id="secret-key" placeholder="秘密の合言葉">
  <input type="text" id="camera-name" placeholder="カメラの名前 (例: スマホ1)">
  <button onclick="startCamera()">カメラを起動して配信開始</button>
</div>

<div id="monitor-area" style="display: none; text-align: center;">
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="msg">初期化中...</span>
  </div>
  <div id="bat-status" style="font-size:12px; color:#aaa; margin-top:5px;">Battery: --%</div>
  <div class="hint">このウィンドウはバックグラウンド（最小化）で動作可能です</div>
</div>

<video id="video" autoplay playsinline muted></video>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
const dot = document.getElementById('dot');
const msg = document.getElementById('msg');
const batStatus = document.getElementById('bat-status');
let secret = "";
let camName = "";
let batteryInterval = null;

async function startCamera() {
  secret = document.getElementById('secret-key').value.trim();
  camName = document.getElementById('camera-name').value.trim() || "Unknown-Cam";
  if(!secret) { alert("合言葉を入力してください"); return; }

  document.getElementById('auth-area').style.display = 'none';
  document.getElementById('monitor-area').style.display = 'block';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    document.getElementById('video').srcObject = stream;
    msg.textContent = 'サーバーに接続中...';
    
    initPeer(stream);
  } catch(e) {
    msg.textContent = 'カメラエラー: ' + e.message;
  }
}

function initPeer(stream) {
  // 他のカメラとIDがぶつからないよう、自分のカメラ名(エンコード済)をIDの末尾に付与
  const myID = 'camerasaba-' + secret + '-' + encodeURIComponent(camName);
  const targetID = 'viewersaba-' + secret;

  const peer = new Peer(myID, { host:'0.peerjs.com', port:443, secure:true });

  peer.on('open', () => {
    msg.textContent = '監視モニターを探しています...';
    doCall(peer, targetID, stream);
  });

  peer.on('error', (e) => {
    msg.textContent = 'エラー: ' + e.type;
    dot.className = 'dot';
  });
}

async function sendBatteryInfo(peer, targetID) {
  try {
    const battery = await navigator.getBattery();
    const level = Math.floor(battery.level * 100);
    // モニター側にデータチャンネルを繋いでバッテリー情報を送る
    const conn = peer.connect(targetID);
    conn.on('open', () => {
      conn.send({ type: 'battery', name: camName, level: level });
      batStatus.textContent = `Battery: ${level}% (連動送信中)`;
      setTimeout(() => conn.close(), 2000); // 送信したら切断して回線をあける
    });
  } catch (e) {
    // バッテリーAPI非対応ブラウザの場合
  }
}

function doCall(peer, targetID, stream) {
  const call = peer.call(targetID, stream);
  let connected = false;

  call.peerConnection.onconnectionstatechange = () => {
    const state = call.peerConnection.connectionState;
    if (state === 'connected') {
      connected = true;
      msg.textContent = `✅ モニター[${camName}]に送信中`;
      dot.className = 'dot on';
      
      // 1分ごとにバッテリー状態を定期送信
      if(batteryInterval) clearInterval(batteryInterval);
      sendBatteryInfo(peer, targetID);
      batteryInterval = setInterval(() => sendBatteryInfo(peer, targetID), 60000);

    } else if ((state === 'disconnected' || state === 'failed') && connected) {
      handleDisconnect(peer, targetID, stream);
    }
  };

  call.on('close', () => handleDisconnect(peer, targetID, stream));
  call.on('error', () => handleDisconnect(peer, targetID, stream));
}

function handleDisconnect(peer, targetID, stream) {
  if(batteryInterval) clearInterval(batteryInterval);
  msg.textContent = 'モニター切断。再接続を待機中...';
  dot.className = 'dot';
  setTimeout(() => doCall(peer, targetID, stream), 4000);
}
</script>
</body>
</html>
